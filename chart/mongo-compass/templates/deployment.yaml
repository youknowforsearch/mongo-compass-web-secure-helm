{{- if and .Values.auth.oidc.enabled .Values.oauth2Proxy.enabled }}
{{- fail "auth.oidc.enabled (native OIDC) and oauth2Proxy.enabled cannot both be true; choose one authentication method" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mongo-compass.fullname" . }}
  labels:
    {{- include "mongo-compass.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mongo-compass.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mongo-compass.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mongo-compass.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- $secretName := include "mongo-compass.secretName" . }}
            - name: CW_HOST
              value: "0.0.0.0"
            - name: CW_PORT
              value: "{{ .Values.service.port }}"
            {{- if and .Values.mongodbUriFromSecret .Values.mongodbUriFromSecret.secretName .Values.mongodbUriFromSecret.secretKey }}
            - name: CW_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mongodbUriFromSecret.secretName | quote }}
                  key: {{ .Values.mongodbUriFromSecret.secretKey | quote }}
            {{- else if .Values.defaultMongodbUri }}
            - name: CW_MONGO_URI
              value: "{{ .Values.defaultMongodbUri }}"
            {{- end }}
            {{- with .Values.appName }}
            - name: CW_APP_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.baseRoute }}
            - name: CW_BASE_ROUTE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.editConnections.enabled }}
            - name: CW_ENABLE_EDIT_CONNECTIONS
              value: "true"
            {{- if or .Values.secret.existingSecret .Values.editConnections.masterPassword }}
            - name: CW_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: master-password
            {{- end }}
            {{- end }}
            {{- if .Values.shell.enabled }}
            - name: CW_ENABLE_SHELL
              value: "true"
            {{- end }}
            {{- if .Values.genAI.enabled }}
            - name: CW_ENABLE_GEN_AI
              value: "true"
            {{- if .Values.genAI.sampleDocuments }}
            - name: CW_ENABLE_GEN_AI_SAMPLE_DOCUMENTS
              value: "true"
            {{- end }}
            {{- if or .Values.secret.existingSecret .Values.genAI.openaiApiKey }}
            - name: CW_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: openai-api-key
            {{- end }}
            {{- with .Values.genAI.openaiModel }}
            - name: CW_OPENAI_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.genAI.querySystemPrompt }}
            - name: CW_QUERY_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.genAI.aggregationSystemPrompt }}
            - name: CW_AGGREGATION_SYSTEM_PROMPT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.oidc.enabled }}
            - name: CW_OIDC_ISSUER
              value: {{ required "auth.oidc.issuer is required when auth.oidc.enabled is true" .Values.auth.oidc.issuer | quote }}
            - name: CW_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId is required when auth.oidc.enabled is true" .Values.auth.oidc.clientId | quote }}
            {{- if or .Values.secret.existingSecret .Values.auth.oidc.clientSecret }}
            - name: CW_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: oidc-client-secret
            {{- end }}
            {{- $redirectURI := include "mongo-compass.oidcRedirectURI" . }}
            {{- with $redirectURI }}
            - name: CW_OIDC_REDIRECT_URI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.scope }}
            - name: CW_OIDC_SCOPE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.postLogoutRedirectUri }}
            - name: CW_OIDC_POST_LOGOUT_REDIRECT_URI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.allowedGroups }}
            - name: CW_OIDC_ALLOWED_GROUPS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.groupsClaim }}
            - name: CW_OIDC_GROUPS_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if or .Values.auth.oidc.enabled .Values.auth.sessionSecret }}
            {{- if or .Values.secret.existingSecret .Values.auth.sessionSecret }}
            - name: CW_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: session-secret
            {{- else }}
            {{- fail "auth.sessionSecret (or secret.existingSecret with a session-secret key) is required when auth.oidc.enabled is true" }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.basic.enabled }}
            - name: CW_BASIC_AUTH_USERNAME
              value: {{ required "auth.basic.username is required when auth.basic.enabled is true" .Values.auth.basic.username | quote }}
            {{- if or .Values.secret.existingSecret .Values.auth.basic.password }}
            - name: CW_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: basic-auth-password
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.oauth2Proxy.enabled }}
        - name: oauth2-proxy
          image: "{{ .Values.oauth2Proxy.image.repository }}:{{ .Values.oauth2Proxy.image.tag }}"
          imagePullPolicy: {{ .Values.oauth2Proxy.image.pullPolicy }}
          args:
            - --provider=oidc
            - --oidc-issuer-url={{ required "oauth2Proxy.oidc.issuerURL is required when oauth2Proxy is enabled" .Values.oauth2Proxy.oidc.issuerURL }}
            - --client-id=$(OAUTH2_PROXY_CLIENT_ID)
            - --client-secret=$(OAUTH2_PROXY_CLIENT_SECRET)
            - --cookie-secret=$(OAUTH2_PROXY_COOKIE_SECRET)
            - --redirect-url={{ include "mongo-compass.oauth2ProxyRedirectURL" . }}
            - --upstream=http://127.0.0.1:{{ .Values.service.port }}/
            - --http-address=0.0.0.0:{{ .Values.oauth2Proxy.port }}
            {{- range .Values.oauth2Proxy.emailDomains }}
            - --email-domain={{ . }}
            {{- end }}
            - --scope={{ join " " .Values.oauth2Proxy.scopes }}
            {{- if .Values.oauth2Proxy.reverseProxy }}
            - --reverse-proxy=true
            {{- end }}
            {{- if .Values.oauth2Proxy.passAccessToken }}
            - --pass-access-token=true
            {{- end }}
            {{- if .Values.oauth2Proxy.setXAuthRequest }}
            - --set-xauthrequest=true
            {{- end }}
            {{- if .Values.oauth2Proxy.setAuthorizationHeader }}
            - --set-authorization-header=true
            {{- end }}
            {{- range .Values.oauth2Proxy.skipAuthRegex }}
            - --skip-auth-regex={{ . }}
            {{- end }}
            {{- range .Values.oauth2Proxy.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongo-compass.oauth2ProxySecretName" . }}
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongo-compass.oauth2ProxySecretName" . }}
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongo-compass.oauth2ProxySecretName" . }}
                  key: cookie-secret
          ports:
            - name: oauth2-proxy
              containerPort: {{ .Values.oauth2Proxy.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: oauth2-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: oauth2-proxy
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.oauth2Proxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
