{{- if and .Values.oauth2Proxy.enabled .Values.oauth2Proxy.secret.create (not .Values.oauth2Proxy.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongo-compass.oauth2ProxySecretName" . }}
  labels:
    {{- include "mongo-compass.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ required "oauth2Proxy.clientID is required when oauth2Proxy is enabled and no existingSecret is set" .Values.oauth2Proxy.clientID | quote }}
  client-secret: {{ required "oauth2Proxy.clientSecret is required when oauth2Proxy is enabled and no existingSecret is set" .Values.oauth2Proxy.clientSecret | quote }}
  cookie-secret: {{ required "oauth2Proxy.cookieSecret is required when oauth2Proxy is enabled and no existingSecret is set (generate with: python -c \"import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())\")" .Values.oauth2Proxy.cookieSecret | quote }}
{{- end }}
