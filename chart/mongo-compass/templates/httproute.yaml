{{- if .Values.httpRoute.enabled -}}
{{- if .Values.ingress.enabled -}}
{{- fail "ingress.enabled and httpRoute.enabled cannot both be true; use one exposure method" -}}
{{- end -}}
apiVersion: {{ .Values.httpRoute.apiVersion }}
kind: HTTPRoute
metadata:
  name: {{ default (include "mongo-compass.fullname" .) .Values.httpRoute.name }}
  labels:
    {{- include "mongo-compass.labels" . | nindent 4 }}
    {{- with .Values.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "mongo-compass.fullname" $ }}
          port: {{ include "mongo-compass.servicePort" $ }}
          weight: 1
    {{- end }}
{{- end }}
